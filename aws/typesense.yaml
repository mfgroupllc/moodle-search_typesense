AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Deploy a single Typesense search server for the Moodle search_typesense plugin.
  Targets an existing VPC/subnet (e.g. the Escoffier moodle-stage environment) and
  exposes port 8108 only to the Moodle security group. No SSH key required
  (access via SSM Session Manager). Typesense runs as a native binary under systemd
  (no Docker), so there is no container runtime or image-pull dependency.

  Hardening mirrors the Escoffier training-moodle83 stack (IMDSv2, encrypted EBS,
  reused SSMinstanceRole) to satisfy account CloudFormation guardrails.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy Typesense into (e.g. the moodle-stage VPC).

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for the Typesense instance (must have internet egress to download the binary).

  MoodleSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group of the Moodle web servers; only this group may reach Typesense on 8108.

  InstanceProfileName:
    Type: String
    Default: SSMinstanceRole
    Description: Existing instance profile (Session Manager + CloudWatch). Reused to avoid creating IAM.

  AMIId:
    Type: AWS::EC2::Image::Id
    Default: ami-052b3645c2c811821
    Description: Amazon Linux 2023 AMI (us-east-2), same as the training-moodle83 host.

  InstanceType:
    Type: String
    Default: t3.small
    Description: EC2 instance type. Typesense is light; t3.small is fine for stage.
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
      - m6i.large

  RootVolumeSize:
    Type: Number
    Default: 30
    Description: Size (GiB) of the instance root volume, which holds the Typesense /data directory.

  TypesenseVersion:
    Type: String
    Default: 27.1
    Description: >
      Typesense version to install, e.g. "27.1". Pinned by default for
      reproducible deployments. "latest" resolves to the newest GitHub release
      at deployment time.

  TypesenseApiKey:
    Type: String
    NoEcho: true
    Description: API key clients (Moodle) must present. Use a strong value.
    MinLength: 8

  EnableCors:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable CORS on Typesense (handy if the Moodle box calls it cross-origin).

Resources:
  TypesenseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Typesense search server
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Typesense API from Moodle only
          IpProtocol: tcp
          FromPort: 8108
          ToPort: 8108
          SourceSecurityGroupId: !Ref MoodleSecurityGroupId
      Tags:
        - {Key: Name, Value: moodle-typesense-stage}
        - {Key: Project, Value: moodle-stage}

  TypesenseInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AMIId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref TypesenseSecurityGroup
      IamInstanceProfile: !Ref InstanceProfileName
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            set -euo pipefail

            # Resolve the Typesense version. "latest" -> newest GitHub release.
            # Strip any leading "v" so the download URL is correct
            # (asset path is "27.1", not "v27.1"). Fall back to a pinned
            # default if the network lookup returns nothing, so we never
            # abort before writing the systemd unit.
            VERSION="${TypesenseVersion}"
            if [ "$VERSION" = "latest" ]; then
              VERSION=$(curl -fsSL https://api.github.com/repos/typesense/typesense/releases/latest \
                | grep -oP '"tag_name":\s*"\K[^"]+' || true)
              [ -z "$VERSION" ] && VERSION="27.1"
            fi
            VERSION=$(echo "$VERSION" | sed 's/^v//')

            # Download and install the single static binary.
            URL="https://dl.typesense.org/releases/$VERSION/typesense-server-$VERSION-linux-amd64.tar.gz"
            curl -fsSL "$URL" -o /tmp/typesense.tar.gz
            tar -xzf /tmp/typesense.tar.gz -C /usr/local/bin
            chmod +x /usr/local/bin/typesense-server
            rm -f /tmp/typesense.tar.gz

            # Data directory lives on the root volume.
            mkdir -p /data

            # Self-signed certificate so Moodle talks to Typesense over TLS.
            # (Internal VPC traffic; we still encrypt the API key + query content.)
            openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
              -keyout /data/typesense.key -out /data/typesense.crt \
              -subj "/CN=typesense.moodle-stage"

            # systemd unit runs the native binary with TLS enabled.
            cat > /etc/systemd/system/typesense.service <<'UNIT'
            [Unit]
            Description=Typesense search server
            After=network.target

            [Service]
            ExecStart=/usr/local/bin/typesense-server --data-dir /data --api-key=${TypesenseApiKey} --enable-cors=${EnableCors} --ssl-certificate /data/typesense.crt --ssl-certificate-key /data/typesense.key
            Restart=always
            User=root

            [Install]
            WantedBy=multi-user.target
            UNIT

            systemctl daemon-reload
            systemctl enable --now typesense
      Tags:
        - {Key: Name, Value: moodle-typesense-stage}
        - {Key: Project, Value: moodle-stage}
        - {Key: b2b-moodle, Value: typesense}

Outputs:
  TypesenseEndpoint:
    Description: Host:port Moodle should use for the Typesense search engine (https://, self-signed cert).
    Value: !Sub "https://${TypesenseInstance.PrivateIp}:8108"
  TypesensePrivateIp:
    Description: Private IP of the Typesense instance.
    Value: !Sub "${TypesenseInstance.PrivateIp}"
  TypesenseInstanceId:
    Description: EC2 instance id (use SSM Session Manager to access).
    Value: !Ref TypesenseInstance
  TypesenseSecurityGroupId:
    Description: Security group id (open 8108 to Moodle only).
    Value: !Ref TypesenseSecurityGroup
