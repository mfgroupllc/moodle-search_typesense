AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Deploy a single-node Typesense search server for the Moodle search_typesense plugin.
  Targets an existing VPC/subnet and exposes port 8108 only to the Moodle web server
  security group. No SSH key required (access via AWS Systems Manager Session Manager).
  Typesense runs as a single native C++ binary under systemd (no Java/JVM, no Docker).

Parameters:
  EnvironmentName:
    Type: String
    Default: moodle-typesense
    Description: Name prefix applied to EC2 instance and Security Group tags.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy Typesense into (same VPC as your Moodle web servers).

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for the Typesense instance (must have internet/NAT egress to download the binary on first boot).

  MoodleSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group of the Moodle web servers; only this group may reach Typesense on TCP 8108.

  InstanceProfileName:
    Type: String
    Default: ""
    Description: >
      Optional existing IAM Instance Profile name with AmazonSSMManagedInstanceCore.
      Leave blank to let this stack create a least-privilege SSM instance profile automatically.

  AMIId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI resolved automatically in any AWS region via SSM.

  InstanceType:
    Type: String
    Default: t3.small
    Description: EC2 instance type. Typesense is a lightweight C++ binary; t3.small or t3.medium handles most institutions.
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
      - m6i.large

  RootVolumeSize:
    Type: Number
    Default: 30
    Description: Size (GiB) of the encrypted gp3 root volume, which holds the Typesense /data directory.

  TypesenseVersion:
    Type: String
    Default: "27.1"
    Description: >
      Typesense version to install (e.g. "27.1"). Pinned by default for reproducible
      deployments. Set to "latest" to resolve the newest release at boot time.

  TypesenseApiKey:
    Type: String
    NoEcho: true
    Description: Master API key that Moodle will present when indexing and querying Typesense.
    MinLength: 16

  EnableCors:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable CORS on Typesense.

Conditions:
  CreateNewInstanceProfile: !Equals [!Ref InstanceProfileName, ""]

Resources:
  TypesenseSSMRole:
    Type: AWS::IAM::Role
    Condition: CreateNewInstanceProfile
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - {Key: Name, Value: !Sub "${EnvironmentName}-ssm-role"}

  TypesenseInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: CreateNewInstanceProfile
    Properties:
      Roles:
        - !Ref TypesenseSSMRole

  TypesenseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Typesense search server (port 8108 restricted to Moodle web tier)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Typesense HTTPS API from Moodle web servers only
          IpProtocol: tcp
          FromPort: 8108
          ToPort: 8108
          SourceSecurityGroupId: !Ref MoodleSecurityGroupId
      Tags:
        - {Key: Name, Value: !Ref EnvironmentName}

  TypesenseInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AMIId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref TypesenseSecurityGroup
      IamInstanceProfile: !If [CreateNewInstanceProfile, !Ref TypesenseInstanceProfile, !Ref InstanceProfileName]
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            set -euo pipefail

            VERSION="${TypesenseVersion}"
            if [ "$VERSION" = "latest" ]; then
              VERSION=$(curl -fsSL https://api.github.com/repos/typesense/typesense/releases/latest \
                | grep -oP '"tag_name":\s*"\K[^"]+' || true)
              [ -z "$VERSION" ] && VERSION="27.1"
            fi
            VERSION=$(echo "$VERSION" | sed 's/^v//')

            # Download and install the single static Typesense binary.
            URL="https://dl.typesense.org/releases/$VERSION/typesense-server-$VERSION-linux-amd64.tar.gz"
            curl -fsSL "$URL" -o /tmp/typesense.tar.gz
            tar -xzf /tmp/typesense.tar.gz -C /usr/local/bin
            chmod +x /usr/local/bin/typesense-server
            rm -f /tmp/typesense.tar.gz

            mkdir -p /data

            # Self-signed certificate with IP SAN so in-VPC traffic is encrypted over TLS.
            PRIVATE_IP=$(hostname -I | awk '{print $1}')
            openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
              -keyout /data/typesense.key -out /data/typesense.crt \
              -subj "/CN=typesense.local" \
              -addext "subjectAltName=IP:${PRIVATE_IP},DNS:typesense.local"

            cat > /etc/systemd/system/typesense.service <<'UNIT'
            [Unit]
            Description=Typesense Search Server
            After=network.target

            [Service]
            ExecStart=/usr/local/bin/typesense-server --data-dir /data --api-key=${TypesenseApiKey} --enable-cors=${EnableCors} --ssl-certificate /data/typesense.crt --ssl-certificate-key /data/typesense.key
            Restart=always
            User=root

            [Install]
            WantedBy=multi-user.target
            UNIT

            systemctl daemon-reload
            systemctl enable --now typesense
      Tags:
        - {Key: Name, Value: !Ref EnvironmentName}
        - {Key: Application, Value: moodle-typesense}

Outputs:
  TypesenseEndpoint:
    Description: Host:port URL to enter in Moodle search_typesense settings.
    Value: !Sub "https://${TypesenseInstance.PrivateIp}:8108"
  TypesensePrivateIp:
    Description: Private VPC IP of the Typesense instance.
    Value: !Sub "${TypesenseInstance.PrivateIp}"
  TypesenseInstanceId:
    Description: EC2 instance ID (connect via AWS SSM Session Manager).
    Value: !Ref TypesenseInstance
  TypesenseSecurityGroupId:
    Description: Security group ID restricting port 8108 to Moodle web servers.
    Value: !Ref TypesenseSecurityGroup
